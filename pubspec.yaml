name: mind_match_game
description: "A Flutter quiz game with offline storage and Firebase leaderboard."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.0.5

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  firebase_core: ^4.1.1
  cloud_firestore: ^6.0.1

  audioplayers: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/LOGO.png
    - assets/audio/bg_music.mp3