name: mind_match_game
description: "A Flutter quiz game with offline storage and Firebase leaderboard."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.0.5

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # Firebase
  firebase_core: ^4.1.1
  cloud_firestore: ^6.0.1

  # Audio
  audioplayers: ^6.6.0
  # Vibration
  vibration: ^3.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/LOGO.png
    - assets/audio/bg_music.mp3
    - assets/audio/click.mp3
    - assets/audio/correct.mp3
    - assets/audio/wrong.mp3